<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - AsynchAds</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h2>My Ad Network Portal</h2>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h1>Welcome Back!</h1>
      <p>You are logged in as: <strong id="userEmail">Loading...</strong></p>
    </div>

    <div class="card">
      <h3>Your Campaigns</h3>
      <div id="campaignList">Loading...</div>
      <a href="create-campaign.html">
        <button class="btn-green" style="padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; color: white;">+ Create New Campaign</button>
      </a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("userEmail").textContent = user.email;
        loadCampaigns(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    async function loadCampaigns(userId) {
      const list = document.getElementById("campaignList");
      try {
        const q = query(collection(db, "campaigns"), where("userId", "==", userId));
        const snapshot = await getDocs(q);
        list.innerHTML = "";

        if (snapshot.empty) {
          list.innerHTML = "<p>No campaigns yet.</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const impressions = data.impressions || 0;
          const clicks = data.clicks || 0;
          const spend = data.spend || 0;
          const ctr = impressions > 0 ? ((clicks / impressions) * 100).toFixed(2) : "0.00";

          list.innerHTML += `
            <div class="campaign-item">
              <h4>${data.campaignName}</h4>
              <p>Budget: $${data.budget} | Status: <strong>${data.status}</strong></p>
              <table class="stats-table">
                <tr><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Spend</th></tr>
                <tr>
                  <td>${impressions.toLocaleString()}</td>
                  <td>${clicks.toLocaleString()}</td>
                  <td>${ctr}%</td>
                  <td>$${spend}</td>
                </tr>
              </table>
              <button class="btn-delete" onclick="deleteCampaign('${docSnap.id}')">Delete</button>
            </div>
          `;
        });
      } catch (error) {
        console.error("Error loading campaigns:", error);
        list.innerHTML = "<p style='color:red;'>Error loading campaigns.</p>";
      }
    }

    window.deleteCampaign = async function(id) {
      if (!confirm("Delete this campaign?")) return;
      await deleteDoc(doc(db, "campaigns", id));
      const user = auth.currentUser;
      if (user) loadCampaigns(user.uid);
    };

    document.getElementById("logoutBtn").addEventListener("click", function() {
      signOut(auth).then(() => window.location.href = "login.html");
    });
  </script>
</body>
</html>
