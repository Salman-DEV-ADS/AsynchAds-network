<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - My Ad Network</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
    .navbar {
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h2 { margin: 0; }
    .logout-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .container { padding: 30px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    #userEmail { font-weight: bold; }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>My Ad Network Portal</h2>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h1>Welcome Back!</h1>
      <p>You are logged in as: <span id="userEmail">Loading...</span></p>
      <p>This is where your clients will create campaigns and see their stats.</p>
    </div>

        <div class="card">
      <h3>Your Campaigns</h3>
      <div id="campaignList">Loading campaigns...</div>
      <a href="create-campaign.html">
        <button style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">+ Create New Campaign</button>
      </a>
    </div>
         
            <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
 import { getFirestore, collection, query, where, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSyALBt9hfwejVrpmAU2I2JY3h7puWT77tOo",
      authDomain: "asynchads-network.firebaseapp.com",
      projectId: "asynchads-network",
      storageBucket: "asynchads-network.firebasestorage.app",
      messagingSenderId: "871536301577",
      appId: "1:871536301577:web:8d706774f71c48dcc30ad8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // THE BOUNCER: Check if user is logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById("userEmail").textContent = user.email;
        loadCampaigns(user.uid); 
      } else {
        window.location.href = "login.html";
      }
    });

    // Load campaigns
    async function loadCampaigns(userId) {
      const list = document.getElementById("campaignList");
      try {
        const q = query(collection(db, "campaigns"), where("userId", "==", userId));
        const querySnapshot = await getDocs(q);
        
        list.innerHTML = ""; 
        
        if (querySnapshot.empty) {
          list.innerHTML = "<p>No campaigns yet.</p>";
        } else {
                   querySnapshot.forEach((doc) => {
            const data = doc.data();
            const impressions = data.impressions || 0;
            const clicks = data.clicks || 0;
            const spend = data.spend || 0;
            const ctr = impressions > 0 ? ((clicks / impressions) * 100).toFixed(2) : "0.00";

            list.innerHTML += `
              <div style="border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 5px;">
                <h4 style="margin: 0; color: #007bff;">${data.campaignName}</h4>
                <p style="margin: 5px 0;">Budget: $${data.budget} | Status: <strong>${data.status}</strong></p>
                <table style="width:100%; margin-top: 10px; text-align: center; border-collapse: collapse;">
                  <tr style="background: #f4f7f6;">
                    <th style="padding: 8px;">Impressions</th>
                    <th style="padding: 8px;">Clicks</th>
                    <th style="padding: 8px;">CTR</th>
                    <th style="padding: 8px;">Spend</th>
                  </tr>
                  <tr>
                    <td style="padding: 8px;">${impressions.toLocaleString()}</td>
                    <td style="padding: 8px;">${clicks.toLocaleString()}</td>
                    <td style="padding: 8px;">${ctr}%</td>
                    <td style="padding: 8px;">$${spend}</td>
                  </tr>
                </table>
              </div>
            `;
          });
        }
      } catch (error) {
        console.error("Error loading campaigns: ", error);
        list.innerHTML = "<p style='color:red;'>Error loading campaigns.</p>";
      }
    }

        // DELETE A CAMPAIGN
    window.deleteCampaign = async function(campaignId) {
      if (!confirm("Are you sure you want to delete this campaign?")) return;
      
      try {
        await deleteDoc(doc(db, "campaigns", campaignId));
        // Refresh the list after deletion
        const user = auth.currentUser;
        if (user) loadCampaigns(user.uid);
      } catch (error) {
        console.error("Error deleting campaign: ", error);
        alert("Error deleting campaign. Check console.");
      }
    }

    // THE FIXED LOGOUT BUTTON
    document.getElementById("logoutBtn").addEventListener("click", function() {
      signOut(auth).then(() => {
        window.location.href = "login.html"; 
      });
    });
  </script>
</body>
</html>
