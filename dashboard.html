<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - My Ad Network</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
    .navbar {
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h2 { margin: 0; }
    .logout-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .container { padding: 30px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    #userEmail { font-weight: bold; }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>My Ad Network Portal</h2>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h1>Welcome Back!</h1>
      <p>You are logged in as: <span id="userEmail">Loading...</span></p>
      <p>This is where your clients will create campaigns and see their stats.</p>
    </div>

    <div class="card">
      <h3>Your Campaigns</h3>
      <p>No campaigns yet. (We will build this next!)</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // PASTE YOUR FIREBASE CONFIG HERE (Same as login.html)
    const firebaseConfig = {
      apiKey: "AIzaSyALBt9hfwejVrpmAU2I2JY3h7puWT77tOo",
      authDomain: "asynchads-network.firebaseapp.com",
      projectId: "asynchads-network",
      storageBucket: "asynchads-network.firebasestorage.app",
      messagingSenderId: "871536301577",
      appId: "1:871536301577:web:8d706774f71c48dcc30ad8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 1. THE BOUNCER: Check if user is logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User is logged in
        document.getElementById("userEmail").textContent = user.email;
      } else {
        // User is NOT logged in. Kick them out to the login page.
        window.location.href = "login.html";
      }
    });

    // 2. THE LOGOUT BUTTON
    document.getElementById("logoutBtn").addEventListener("click", function() {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
