<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - My Ad Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h1>Create Account</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password (min 6 characters)">
    <button id="signupBtn" class="btn-green">Sign Up</button>
    <p id="message"></p>
    <p class="link"><a id="loginLink" href="login.html">Already have an account? Login</a></p>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const urlParams = window.location.search;
    if (urlParams) {
      document.getElementById("loginLink").href = "login.html" + urlParams;
    }

    document.getElementById("signupBtn").addEventListener("click", function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          message.style.color = "green";
          message.textContent = "Account created! Redirecting...";
          setTimeout(() => {
            window.location.href = urlParams ? "create-campaign.html" + urlParams : "dashboard.html";
          }, 1500);
        })
        .catch((error) => {
          message.style.color = "red";
          message.textContent = "Error: " + error.message;
        });
    });
  </script>
</body>
</html>
