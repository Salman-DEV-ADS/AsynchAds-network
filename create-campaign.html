<!DOCTYPE html>
<html>
<head>
  <title>Create Campaign - AsynchAds</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific: form styles */
    .form-container { padding: 30px; max-width: 500px; margin: auto; }
    .form-card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .form-card label { display: block; margin-top: 10px; font-weight: bold; color: #333; }
    .form-card input, .form-card select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .form-card button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    .form-card button:hover { background-color: #218838; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #007bff; }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>Create Campaign</h2>
  </div>

  <div class="form-container">
    <div class="form-card">
      <form id="campaignForm">
        <label>Campaign Name</label>
        <input type="text" id="campaignName" placeholder="e.g., Summer Sale 2024" required>

        <label>Ad Image URL</label>
        <input type="url" id="adImage" placeholder="https://example.com/banner.jpg" required>

        <label>Target Link (Where the ad goes)</label>
        <input type="url" id="targetLink" placeholder="https://yourwebsite.com" required>

        <label>Budget ($)</label>
        <input type="number" id="budget" placeholder="100" required>

        <label>Category</label>
        <select id="category">
          <option value="technology">Technology</option>
          <option value="fashion">Fashion</option>
          <option value="gaming">Gaming</option>
          <option value="food">Food</option>
          <option value="business">Business</option>
        </select>

        <button type="submit">Launch Campaign</button>
        <p id="message"></p>
      </form>
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Auto-fill from URL params
    function fillFormFromURL() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      const budget = params.get('budget');
      const category = params.get('category');

      console.log("AUTO-FILL RUNNING. Params:", { name, budget, category });

      if (name) document.getElementById('campaignName').value = name;
      if (budget) document.getElementById('budget').value = budget;
      if (category) document.getElementById('category').value = category;
    }
    fillFormFromURL();

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
      } else {
        const params = window.location.search;
        window.location.href = "signup.html" + params;
      }
    });

    document.getElementById("campaignForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const message = document.getElementById("message");
      message.style.color = "black";
      message.textContent = "Saving campaign...";

      const name = document.getElementById("campaignName").value;
      const image = document.getElementById("adImage").value;
      const link = document.getElementById("targetLink").value;
      const budget = document.getElementById("budget").value;
      const category = document.getElementById("category").value;

      try {
        await addDoc(collection(db, "campaigns"), {
          userId: currentUser.uid,
          userEmail: currentUser.email,
          campaignName: name,
          adImage: image,
          targetLink: link,
          budget: budget,
          category: category,
          status: "Pending Review",
          createdAt: new Date()
        });

               message.style.color = "green";
        message.textContent = "Campaign created successfully! Redirecting to payment...";
        document.getElementById("campaignForm").reset();

        // Pass the budget and campaign name to the payment page
        const paymentParams = new URLSearchParams({
          amount: budget,
          campaign: name
        });

        setTimeout(() => {
          window.location.href = "payment.html?" + paymentParams.toString();
        }, 1500);

      } catch (error) {
        message.style.color = "red";
        message.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
