<!DOCTYPE html>
<html>
<head>
  <title>Login - My Ad Network</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h1 { text-align: center; color: #333; }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background-color: #0056b3; }
    #message { color: red; text-align: center; margin-top: 10px; }
    .link { text-align: center; margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="message"></p>
    <p class="link"><a id="signupLink" href="signup.html">Don't have an account? Sign Up</a></p>
  </div>

  <script type="module">
    // 1. IMPORTS
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";

    // 2. FIREBASE CONFIG (Paste your real keys)
    const firebaseConfig = {
    apiKey: "AIzaSyALBt9hfwejVrpmAU2I2JY3h7puWT77tOo",
      authDomain: "asynchads-network.firebaseapp.com",
      projectId: "asynchads-network",
      storageBucket: "asynchads-network.firebasestorage.app",
      messagingSenderId: "871536301577",
      appId: "1:871536301577:web:8d706774f71c48dcc30ad8"
    };

    // 3. INITIALIZE APP FIRST
    const app = initializeApp(firebaseConfig);

    // 4. APP CHECK SECOND
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider('6LeFJNctAAAAAJt3zj8Eg_MeUtNUnOiveMBEDuM1'),
      isTokenAutoRefreshEnabled: true
    });

    // 5. THEN AUTH
    const auth = getAuth(app);

    // 6. PRESERVE PARAMS IF COMING FROM "BUY NOW" FLOW
    const urlParams = window.location.search;
    if (urlParams) {
      document.getElementById("signupLink").href = "signup.html" + urlParams;
    }

    // 7. LOGIN LOGIC
    document.getElementById("loginBtn").addEventListener("click", function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          message.style.color = "green";
          message.textContent = "Login successful! Redirecting...";
          
          // If they came from a "Buy Now" flow, send them back to finish the order
          if (urlParams) {
            window.location.href = "create-campaign.html" + urlParams;
          } else {
            window.location.href = "dashboard.html";
          }
        })
        .catch((error) => {
          message.style.color = "red";
          message.textContent = "Error: " + error.message;
        });
    });
  </script>
</body>
</html>
