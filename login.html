<!DOCTYPE html>
<html>
<head>
  <title>Login - AsynchAds</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h1>Login</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" class="btn-blue">Login</button>
    <p id="message"></p>
    <p class="link"><a id="signupLink" href="signup.html">Don't have an account? Sign Up</a></p>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const urlParams = window.location.search;
    if (urlParams) {
      document.getElementById("signupLink").href = "signup.html" + urlParams;
    }

    document.getElementById("loginBtn").addEventListener("click", function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          message.style.color = "green";
          message.textContent = "Login successful! Redirecting...";
          if (urlParams) {
            window.location.href = "create-campaign.html" + urlParams;
          } else {
            window.location.href = "dashboard.html";
          }
        })
        .catch((error) => {
          message.style.color = "red";
          message.textContent = "Error: " + error.message;
        });
    });
  </script>
</body>
</html>
